apply plugin: 'com.android.application'

android {
    namespace = "us.tendrid.chrometria"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "us.tendrid.chrometria"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // SECURITY NOTE: an earlier revision of this file committed the release
    // keystore password as a hardcoded fallback. That keystore/password pair
    // lives in git history and must be considered compromised — ROTATE the
    // release keystore (generate a new one) before uploading to Play, and
    // enroll in Play App Signing so a leaked upload key can be reset.
    //
    // Signing credentials are now supplied ONLY via environment variables
    // (CHROMETRIA_KEYSTORE, CHROMETRIA_STORE_PASSWORD, CHROMETRIA_KEY_PASSWORD)
    // or Gradle properties (chrometria.keystore / chrometria.storePassword /
    // chrometria.keyPassword, e.g. in ~/.gradle/gradle.properties — never in
    // the repo). A release build fails fast with a clear message if any are
    // missing. There are no fallback values.
    def signingCred = { String envName, String propName ->
        def fromEnv = System.getenv(envName)
        if (fromEnv) return fromEnv
        return project.hasProperty(propName) ? project.property(propName) : null
    }
    def releaseKeystorePath = signingCred("CHROMETRIA_KEYSTORE", "chrometria.keystore")
    def releaseStorePassword = signingCred("CHROMETRIA_STORE_PASSWORD", "chrometria.storePassword")
    def releaseKeyPassword = signingCred("CHROMETRIA_KEY_PASSWORD", "chrometria.keyPassword")
    def releaseSigningConfigured = releaseKeystorePath && releaseStorePassword && releaseKeyPassword

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias "chrometria"
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    if (!releaseSigningConfigured) {
        // Only fail when a release build/bundle is actually requested, so
        // debug builds keep working without credentials.
        gradle.taskGraph.whenReady { graph ->
            def wantsSignedRelease = graph.allTasks.any { task ->
                task.project == project && task.name.toLowerCase().contains("release")
            }
            if (wantsSignedRelease) {
                throw new GradleException(
                    "Release signing is not configured. Set the CHROMETRIA_KEYSTORE, " +
                    "CHROMETRIA_STORE_PASSWORD and CHROMETRIA_KEY_PASSWORD environment variables " +
                    "(or chrometria.keystore / chrometria.storePassword / chrometria.keyPassword " +
                    "Gradle properties). Never commit these values. NOTE: the previous keystore " +
                    "password was committed to git history — rotate the keystore before release."
                )
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
