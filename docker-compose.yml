services:
  musical-symmetry-ui:
    build:
      context: .
      dockerfile: packages/ui/Dockerfile
    container_name: musical-symmetry-ui
    ports:
      - "3009:80"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  musical-symmetry-analyzer:
    build:
      context: .
      dockerfile: packages/analyzer/Dockerfile
    container_name: musical-symmetry-analyzer
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - SESSION_SECRET=${SESSION_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - STRIPE_PRICE_RESEARCH=${STRIPE_PRICE_RESEARCH:-}
      - APP_URL=${APP_URL:-https://symmetry.tendrid.us}
    volumes:
      - analyzer-data:/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  analyzer-data:
