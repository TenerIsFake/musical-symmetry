services:
  musical-symmetry-ui:
    build:
      context: .
      dockerfile: packages/ui/Dockerfile
      args:
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
    container_name: musical-symmetry-ui
    ports:
      - "3009:80"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  musical-symmetry-analyzer:
    build:
      context: .
      dockerfile: packages/analyzer/Dockerfile
    container_name: musical-symmetry-analyzer
    ports:
      - "3014:3010"
    environment:
      - PORT=3010
      - SESSION_SECRET=${SESSION_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - STRIPE_PRICE_RESEARCH=${STRIPE_PRICE_RESEARCH:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Musical Symmetry <noreply@tendrid.us>}
      - APP_URL=${APP_URL:-https://symmetry.tendrid.us}
    volumes:
      - analyzer-data:/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  timbria-api:
    build:
      context: .
      dockerfile: packages/timbria-api/Dockerfile
    container_name: timbria-api
    # Bound to localhost only — the UI reaches it over the compose network
    # (timbria-api:3061). Keeps the Gemini/RevenueCat/CF keys off the LAN;
    # Cloudflare Access (on the UI hostname) is the sole public entry point.
    ports:
      - "127.0.0.1:3061:3061"
    environment:
      - PORT=3061
      - TIMBRIA_DB=/data/timbria.db
      - OWNER_EMAIL=${OWNER_EMAIL:-tenerjenkins@gmail.com}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-https://tendrid.cloudflareaccess.com}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD_TIMBRIA:-}
      - REVENUECAT_API_KEY=${REVENUECAT_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Remote Coral Edge-TPU ear-infer service on the Windows host (10.0.0.155:9009).
      # Unset -> StubEarInfer; set -> ResilientEarInfer(Http, Stub fallback). See
      # services/ear-infer/ + build-ear-infer.ts. Windows LAN IP (not the WSL gateway,
      # which changes across WSL restarts).
      - EAR_INFER_URL=${EAR_INFER_URL:-http://10.0.0.155:9009}
    volumes:
      - timbria-data:/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  timbria-ui:
    build:
      context: .
      dockerfile: packages/timbria-ui/Dockerfile
      args:
        VITE_KIWIX_BASE: ${VITE_KIWIX_BASE:-https://kiwix.tendrid.us}
        VITE_KIWIX_WIKI_ID: ${VITE_KIWIX_WIKI_ID:-53a8f711-f7f9-ec23-08fc-38fcf579ba32}
    container_name: timbria-ui
    # Public entry point — LAN-exposed so SRV-1's cloudflared can reach it,
    # then fronted by the timbria.tendrid.us tunnel + Cloudflare Access.
    ports:
      - "3017:80"
    depends_on:
      - timbria-api
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  analyzer-data:
  timbria-data:
