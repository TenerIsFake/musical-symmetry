# Tests and typechecks on every push and pull request.
#
# Added 2026-09-21. Until then nothing enforced the suites on a push — they
# were run by hand, which works right up until the once it doesn't. It matters
# more from here: the iOS plan ports `packages/core` to Swift and verifies it
# against generated conformance vectors, and "the TypeScript and the Swift
# agree" is only a guarantee if something checks it without being asked.
#
# Every workspace listed below was confirmed green before this file was written
# (258 tests). If a job here is red, the repo is red — do not add `|| true`.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version used on the build machine.
          node-version: '22'
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly, which is the
      # point: a drifted lockfile fails here rather than producing a build that
      # only works on one machine.
      - run: npm ci

      # packages/timbria-api shells out to ffmpeg to decode audio clips. It is
      # not on the runner image, and its absence does not fail loudly: the
      # decode returns ENOENT, the route answers 400, and two route tests then
      # report "expected 400 to be 200" — which reads like a routing bug rather
      # than a missing binary.
      #
      # This is why the first run of this workflow went red. It was rehearsed in
      # a clean CLONE on the build machine, which already had ffmpeg — proving
      # the checkout was complete, not that the environment was.
      - name: Install ffmpeg (required by timbria-api's audio tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test — core (the music-theory engine)
        run: npm -w packages/core test

      - name: Test — analyzer (API, auth, account deletion)
        run: npm -w packages/analyzer test

      - name: Test — ui
        run: npm -w packages/ui test

      - name: Test — timbria-api
        run: npm -w packages/timbria-api test

      - name: Test — timbria-ui
        run: npm -w packages/timbria-ui test

  # packages/core-swift is a port of packages/core, held to the same generated
  # conformance vectors: Vitest replays them against the TypeScript, XCTest
  # replays the SAME file against the Swift. That is the whole argument for
  # porting rather than embedding a JS runtime — and it is only a guarantee if
  # something checks it without being asked. Hence this job.
  #
  # A failure here usually means the two implementations have drifted. Read it
  # that way before assuming the Swift is at fault: if test-vectors.json was
  # regenerated, the TypeScript's behaviour moved and the Swift must follow.
  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No official setup-swift action from Apple; this is the toolchain the
      # package was developed against. Pinned deliberately — a silent major
      # bump could change language-mode defaults, which is exactly what bit
      # this package during development (Swift 6 mode rejected a non-Sendable
      # static that earlier toolchains accepted).
      - name: Install Swift
        run: |
          SWIFT=swift-6.4.0-RELEASE
          curl -fsSL -O "https://download.swift.org/swift-6.4.0-release/ubuntu2404/${SWIFT}/${SWIFT}-ubuntu24.04.tar.gz"
          tar xzf "${SWIFT}-ubuntu24.04.tar.gz"
          echo "$PWD/${SWIFT}-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"

      - run: swift --version

      # Note: `swift test` prints a trailing swift-testing summary reading
      # "Test run with 0 tests in 0 suites passed" — that means no
      # swift-testing tests exist here, NOT that nothing ran. The real result
      # is XCTest's "Executed N tests, with M failures", and the step's exit
      # code, which is what actually gates this job.
      - name: Test — core-swift (conformance against the generated vectors)
        working-directory: packages/core-swift
        run: swift test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # packages/timbria-ui has no typecheck script; the rest do.
      - run: npm -w packages/core run typecheck
      - run: npm -w packages/analyzer run typecheck
      - run: npm -w packages/ui run typecheck
      - run: npm -w packages/timbria-api run typecheck
